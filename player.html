<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertical Rio — OBS Multiview</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
  }

  .screen {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: 2fr 1fr;
    background: #000;
  }

  .left {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 2fr 1fr;
  }

  .left-bottom {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .right {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(3, 1fr);
  }

  .panel {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #000;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }

  .panel-label {
    position: absolute;
    z-index: 10;
    top: 6px;
    left: 6px;
    padding: 4px 7px;
    border-radius: 4px;
    background: rgba(0,0,0,.52);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    font-weight: 700;
    pointer-events: none;
  }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
    color: #666;
    font-size: 12px;
    line-height: 1.4;
  }

  .windy-frame,
  .video-stage iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .video-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #000;
  }

  .video-stage iframe {
    pointer-events: auto;
  }

  .climate-logo-wrap {
    position: absolute;
    left: 3px;
    top: 42px;
    z-index: 12;
    pointer-events: none;
    background: transparent;
    padding: 0;
    border-radius: 0;
    display: inline-block;
    width: fit-content;
    height: fit-content;
    line-height: 0;
  }

  .climate-logo {
    display: block;
    width: min(32.5vw, 325px);
    max-width: 40%;
    height: auto;
    opacity: 0.9;
    margin: 0;
  }

</style>
</head>

<body>

<script>
(function () {
  const params = new URLSearchParams(location.search);

  const slots = [
    { id: "climateFrame", param: "climate", hosts: ["embed.windy.com"] },
    { id: "yt1Frame", param: "yt1", hosts: ["www.youtube.com", "youtube.com"] },
    { id: "yt2Frame", param: "yt2", hosts: ["www.youtube.com", "youtube.com"] },
    { id: "yt3Frame", param: "yt3", hosts: ["www.youtube.com", "youtube.com"] },
    { id: "yt4Frame", param: "yt4", hosts: ["www.youtube.com", "youtube.com"] },
    { id: "yt5Frame", param: "yt5", hosts: ["www.youtube.com", "youtube.com"] }
  ];

  function isSafe(rawUrl, allowedHosts) {
    let parsed;
    try {
      parsed = new URL(rawUrl);
    } catch (e) {
      return false;
    }
    if (parsed.protocol !== "https:") return false;
    return allowedHosts.includes(parsed.hostname.toLowerCase());
  }

  slots.forEach(slot => {
    const el = document.getElementById(slot.id);
    const value = params.get(slot.param);
    const panel = el.closest(".panel");

    if (value && isSafe(value, slot.hosts)) {
      el.src = value;
      return;
    }

    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = "Sem link configurado para este painel.";
    panel.appendChild(hint);
  });
})();
