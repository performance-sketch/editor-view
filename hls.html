<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLS Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }

  #msg {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #888;
    font: 14px system-ui, sans-serif;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<video id="video" muted autoplay playsinline></video>
<div id="msg"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const raw = params.get("src") || "";
  const video = document.getElementById("video");
  const msg = document.getElementById("msg");

  function showMessage(text) {
    video.style.display = "none";
    msg.style.display = "flex";
    msg.textContent = text;
  }

  let parsed;
  try {
    parsed = new URL(raw);
  } catch (e) {
    showMessage("Link de stream inválido.");
    return;
  }

  if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
    showMessage("Link de stream inválido.");
    return;
  }

  const url = parsed.href;

  function play() {
    video.play().catch(function () {});
  }

  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.addEventListener("loadedmetadata", play);
    video.addEventListener("error", function () {
      showMessage("Não foi possível carregar o stream (o link pode ter expirado).");
    });
  } else if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({ liveSyncDuration: 3, liveMaxLatencyDuration: 10 });
    hls.on(Hls.Events.ERROR, function (event, data) {
      if (data && data.fatal) {
        showMessage("Não foi possível carregar o stream (o link pode ter expirado).");
      }
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, play);
  } else {
    showMessage("Este navegador não suporta reprodução HLS.");
  }
})();
</script>

</body>
</html>
